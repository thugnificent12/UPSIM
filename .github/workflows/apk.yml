name: Crea APK Android
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [index.html]
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Prepara il progetto Capacitor
        run: |
          mkdir www
          cp -r index.html manifest.webmanifest icons www/
          npm init -y
          npm i @capacitor/core @capacitor/cli @capacitor/android @capacitor/assets
          cat > capacitor.config.json <<'EOF'
          {"appId":"it.upsim.game","appName":"UPSimulator","webDir":"www","backgroundColor":"#dbeeff"}
          EOF
          npx cap add android
      - name: Icona
        run: |
          mkdir -p assets
          cp icons/icon-512.png assets/icon-only.png
          cp icons/icon-512.png assets/icon-foreground.png
          python3 - <<'PY'
          import zlib,struct
          w=h=1024
          raw=b''.join(b'\x00'+bytes([0x22,0x55,0xc8])*w for _ in range(h))
          def ch(t,d):
              c=struct.pack('>I',len(d))+t+d
              return c+struct.pack('>I',zlib.crc32(t+d)&0xffffffff)
          open('assets/icon-background.png','wb').write(b'\x89PNG\r\n\x1a\n'+ch(b'IHDR',struct.pack('>IIBBBBB',w,h,8,2,0,0,0))+ch(b'IDAT',zlib.compress(raw))+ch(b'IEND',b''))
          PY
          npx capacitor-assets generate --android
      - name: Compila
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: UPSimulator-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Pubblica il file scaricabile
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk UPSimulator.apk
          gh release delete apk --yes --cleanup-tag || true
          gh release create apk UPSimulator.apk --title "UPSimulator APK" --notes "Ultimo APK di UPSimulator" --latest
