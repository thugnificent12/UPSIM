name: Crea APK Android
on:
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Prepara il progetto Capacitor
        run: |
          mkdir www
          cp -r index.html manifest.webmanifest icons www/
          npm init -y
          npm i @capacitor/core @capacitor/cli @capacitor/android @capacitor/assets
          cat > capacitor.config.json <<'EOF'
          {"appId":"it.upsim.game","appName":"UPSimulator","webDir":"www","backgroundColor":"#dbeeff"}
          EOF
          npx cap add android
      - name: Icona
        run: |
          mkdir -p assets
          cp icons/icon-512.png assets/icon-only.png
          cp icons/icon-512.png assets/icon-foreground.png
          npx capacitor-assets generate --android --iconBackgroundColor '#2255c8' || true
      - name: Schermo intero e orientamento
        run: |
          F=android/app/src/main/AndroidManifest.xml
          sed -i 's/<activity /<activity android:screenOrientation="unspecified" /' $F
          S=android/app/src/main/res/values/styles.xml
          sed -i 's#<item name="android:background">@null</item>#<item name="android:background">@null</item><item name="android:windowFullscreen">true</item><item name="android:windowLayoutInDisplayCutoutMode">shortEdges</item>#' $S
      - name: Compila
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: UPSimulator-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
