name: Crea APK Android
on:
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Prepara il progetto Capacitor
        run: |
          mkdir www
          cp -r index.html manifest.webmanifest icons www/
          npm init -y
          npm i @capacitor/core @capacitor/cli @capacitor/android @capacitor/assets
          cat > capacitor.config.json <<'EOF'
          {"appId":"it.upsim.game","appName":"UPSimulator","webDir":"www","backgroundColor":"#dbeeff"}
          EOF
          npx cap add android
      - name: Icona
        run: |
          mkdir -p assets
          cp icons/icon-512.png assets/icon-only.png
          cp icons/icon-512.png assets/icon-foreground.png
          npx capacitor-assets generate --android --iconBackgroundColor '#2255c8' || true
      - name: Compila
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: UPSimulator-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
