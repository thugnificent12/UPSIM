<style>
/* Layout: insegna blu, barra comandi fissa (orologio, velocità, cassa, gradimento), quattro schede con navigazione in basso. */
:root{
  --bg:#DDF0FF; --surface:#FFFFFF; --surface2:#EAF5FF; --line:#B7D8F5;
  --fg:#0E2A55; --muted:#4C6A99;
  --sign:#1E56C8; --signfg:#FFFFFF;
  --accent:#FFC93C; --accentfg:#3B2A00;
  --good:#1C7C45; --warn:#B26A00; --bad:#C0342B;
  --tk:#FFF3C4; --tkline:#E0BE55;
  --f-display:'Baloo 2','Nunito',system-ui,sans-serif; --hw:800;
  --f-body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  --pri:var(--sign); --prifg:var(--signfg); --logo-bg:var(--accent); --logo-fg:var(--accentfg); --river:var(--sign);
  --st-p:#FFC93C; --st-pf:#3B2A00; --st-sh:#C28F0A; --st-tint:rgba(10,38,92,.74); --st-glass:rgba(255,255,255,.92); --st-gt:#0E2A55;
  --nav:62px;
}
/* Stile Gelato: rosa lampone e menta */
:root[data-st="gelato"]{
  --bg:#FFF1F5; --surface:#FFFFFF; --surface2:#FFE6EE; --line:#F6C6D3; --fg:#3A1E2B; --muted:#8A5A6B;
  --sign:#E8456B; --signfg:#FFFFFF; --accent:#2FD4A8; --accentfg:#06382B; --river:#E8456B;
  --tk:#FFF3C4; --tkline:#E0BE55;
  --f-display:'Fredoka','Nunito',system-ui,sans-serif; --hw:700;
  --st-p:#E8456B; --st-pf:#FFFFFF; --st-sh:#B02E4E; --st-tint:rgba(58,20,40,.72); --st-glass:rgba(255,255,255,.92); --st-gt:#3A1E2B;
}
/* Stile Sera Arcade: viola scuro, arancio e lime */
:root[data-st="sera"]{
  --bg:#251A47; --surface:#352764; --surface2:#2C2056; --line:#4A3A85; --fg:#F4EEFF; --muted:#B5A7DD;
  --sign:#5B3FC4; --signfg:#FFFFFF; --accent:#FF8A3D; --accentfg:#2A1200; --river:#B6F23B;
  --good:#6FE39A; --warn:#F2B84B; --bad:#FF7A70; --tk:#4A3A15; --tkline:#8A7020;
  --pri:var(--accent); --prifg:var(--accentfg); color-scheme:dark;
  --f-display:'Lilita One','Nunito',system-ui,sans-serif; --hw:400;
  --st-p:#FF8A3D; --st-pf:#2A1200; --st-sh:#B85A16; --st-tint:rgba(30,16,66,.78); --st-glass:rgba(53,39,100,.92); --st-gt:#F4EEFF;
}
*{box-sizing:border-box}
.card h2,.cat b,.mbox h2{font-weight:var(--hw)!important}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.4;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.pos{color:var(--good)} .neg{color:var(--bad)}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none;-webkit-text-size-adjust:100%;touch-action:manipulation}
.app{max-width:600px;margin:0 auto;padding-inline:16px;padding-top:max(10px,env(safe-area-inset-top,0px));height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
.app>header,.app>.bar{flex:none}
.app>main{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding-bottom:calc(var(--nav) + 20px + env(safe-area-inset-bottom,0px));margin-inline:-16px;padding-inline:16px}
@media (max-height:620px){.sign p{display:none}.sign{padding:6px 12px}.logo{width:36px;height:36px}}
.sign{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;background:var(--sign);color:var(--signfg);border-radius:14px;padding:10px 14px}
.logo{width:42px;height:42px;flex:none}
.lg-a{fill:var(--logo-bg)} .lg-s{fill:none;stroke:var(--logo-fg);stroke-width:2.4;stroke-linejoin:round;stroke-linecap:round}
.sign .tt{min-width:0;flex:1 1 170px}
.sign h1{margin:0;font:400 12px/1.1 var(--f-body);text-transform:uppercase;text-wrap:balance}
.sign h1 b{display:block;font-family:var(--f-display);font-weight:900;font-size:clamp(14px,4.6vw,20px);letter-spacing:.03em;white-space:nowrap;-webkit-text-stroke:.4px currentColor}
.sign h1 span{display:block;font-weight:400;font-size:clamp(10px,3.2vw,13px);letter-spacing:.3em;margin-top:2px}
.hr{flex:none;display:flex;align-items:flex-start;gap:6px;margin-left:auto}
.hr .daybox{display:flex;flex-direction:column;gap:1px;font-size:10.5px;line-height:1.2;text-align:right}.hr .daybox .clock{font:700 17px/1.1 var(--f-mono);margin-top:2px}.hr .daybox small{font-size:8.5px;opacity:.9;max-width:130px}#clksub.muted{color:#fff!important}#clksub.neg{color:#FFD54F!important}
.sign p{margin:3px 0 0;font-size:12px;opacity:.85;white-space:nowrap}
.daybox{flex:none;text-align:right;font-size:12px;line-height:1.2}

.bar{position:relative;z-index:20;margin-top:6px;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:5px 8px;box-shadow:0 4px 14px rgba(8,17,31,.12)}
.bar .pdsbtn,.bar .callbtn{flex:none;width:auto;min-width:0;min-height:26px;padding:3px 9px;font-size:11.5px;font-weight:800;border-radius:8px}.bar{gap:6px;padding:5px 6px}.bar{justify-content:space-between}.rt{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:3px}.stl{display:flex;gap:8px;font:600 9.5px var(--f-mono);color:var(--muted);white-space:nowrap}.stl b{font:700 10.5px var(--f-mono);color:var(--fg)}
#banner:empty,#fault:empty{display:none}
.clk{display:flex;flex-direction:column;gap:2px;min-width:0}.clk small{font-size:11px;line-height:1.2;max-width:200px}
.clock{letter-spacing:.02em}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface2);padding:3px 5px;font:600 10.5px var(--f-mono);min-width:24px;min-height:0}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--pri);color:var(--prifg)}
.stat{display:flex;flex-direction:column;line-height:1.1;min-width:0}
.stat small{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.stat b{font:600 16px var(--f-mono)}
.bar .stat{flex:1 1 40%}
.tab{display:flex;flex-direction:column;gap:10px;margin-top:8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-width:0}
.card h2{margin:0 0 6px;font:400 17px/1.15 var(--f-display);text-wrap:balance}
.card h3{margin:0;font:700 14px/1.2 var(--f-body)}
.eyebrow{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.btn{border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:9px 14px;font-weight:700;font-size:14px;min-height:40px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.gold{background:var(--accent);color:var(--accentfg);border-color:transparent}
.btn.blue{background:var(--pri);color:var(--prifg);border-color:transparent}
.btn.big{width:100%;min-height:50px;font-size:16px}
.pill{display:inline-block;border-radius:999px;padding:2px 9px;font-size:11.5px;font-weight:700;background:var(--surface2);border:1px solid var(--line);white-space:nowrap}
.pill.good{color:var(--good);border-color:currentColor} .pill.bad{color:var(--bad);border-color:currentColor} .pill.warn{color:var(--warn);border-color:currentColor} .pill.info{color:var(--pri)}
.banner p{margin:6px 0}
.banner.bn-g,.banner.bn-r{color:#fff;border:3px solid}
.banner.bn-g{background:#1B9E3E;border-color:#0F6A28}.banner.bn-r{background:#D32F2F;border-color:#8E1B1B}
.banner.bn-g *,.banner.bn-r *{color:#fff}
.banner.bn-g .btn.gold{background:#fff;color:#0F6A28;border-color:#fff}.banner.bn-r .btn.gold{background:#fff;color:#8E1B1B;border-color:#fff}
.banner.bn-g .pill,.banner.bn-g .tags *{background:rgba(255,255,255,.2)!important;border-color:#fff!important}.banner.bn-g .evt,.banner.bn-r .evt{border-left-color:#fff}

.tags{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.evt{font-size:13.5px;margin:6px 0;padding-left:10px;border-left:3px solid var(--accent)}
.cats{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin:6px 0}
.cat{background:var(--surface2);border:1px solid var(--line);border-radius:999px;padding:2px 4px;display:flex;justify-content:center;align-items:baseline;gap:6px;min-width:0}
.cat b{font:400 14px/1 var(--f-display)}
.cat span{display:block;font-size:9px;overflow-wrap:anywhere;color:var(--muted);line-height:1.15;margin-top:2px}
.cat i{font:600 13px var(--f-mono);font-style:normal}
.tks{display:flex;flex-wrap:wrap;gap:6px}
.tk{position:relative;border:1px solid var(--tkline);background:var(--tk);border-radius:6px;padding:4px 8px 7px;font:600 13px var(--f-mono);min-width:58px;text-align:left;overflow:hidden}
.tk{text-align:left;max-width:100%}.tk small{display:block;font:500 10.5px/1.25 var(--f-body);color:var(--muted);margin-top:1px;white-space:normal;max-width:190px}
.tk .mb{position:absolute;left:0;bottom:0;height:4px;width:calc(var(--m,0) * 100%);background:var(--good)}
.tk.m1 .mb{background:var(--warn)} .tk.m2 .mb{background:var(--bad)}
.tk .pr{position:absolute;right:0;top:0;background:var(--accent);color:var(--accentfg);font:700 9px var(--f-body);padding:1px 4px;border-bottom-left-radius:6px}
.tk.hot{box-shadow:0 0 0 2px var(--accent)}
.cnt{display:flex;flex-direction:column;gap:8px}
.cnt-h{display:flex;align-items:center;gap:8px}
.cnt-h h3{flex:1;min-width:0}
.cnt .who{font-size:12.5px;color:var(--muted)}
.row{display:flex;align-items:baseline;gap:8px;min-width:0;flex-wrap:wrap}
.prog{height:10px;border-radius:6px;background:var(--surface2);border:1px solid var(--line);overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--pri)}
.types{display:flex;align-items:center;flex-wrap:wrap;gap:5px;font-size:12px;color:var(--muted)}
.ty{border:1px solid var(--line);background:var(--surface2);border-radius:8px;min-width:32px;height:34px;padding:0 8px;display:inline-flex;align-items:center;gap:5px;font:700 13px var(--f-mono)}
.ty small{font:600 10.5px var(--f-body);opacity:.9}
.types>span{flex:1 1 100%}
.ty.on{background:var(--pri);color:var(--prifg);border-color:transparent}
.prob{border:1px solid var(--bad);background:var(--surface2);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column;gap:6px}
.prob p{margin:0;font-size:13.5px}
.prob .btn{text-align:left;font-weight:600;font-size:13px;min-height:36px;padding:7px 10px}
.log{display:flex;flex-direction:column;gap:5px;margin:0;padding:0;list-style:none;font-size:13px}
.log li{padding-left:9px;border-left:3px solid var(--line)}
.log li.good{border-color:var(--good)} .log li.bad{border-color:var(--bad)} .log li.warn{border-color:var(--accent)}
.log time{font:500 11px var(--f-mono);color:var(--muted);margin-right:6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kv{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}
.kv:last-child{border-bottom:0}
.kv b{font-family:var(--f-mono);font-variant-numeric:tabular-nums;text-align:right}
.upg{display:flex;flex-direction:column;gap:6px}
.upg-h{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.upg p{margin:0;font-size:13px;color:var(--muted)}
.pips{letter-spacing:2px;color:var(--accent);font-size:14px}
.staff{display:flex;gap:10px;align-items:center}
.staff .tt{flex:1;min-width:0}
.staff small{display:block;color:var(--muted);font-size:12.5px}
.map{width:100%;height:auto;display:block;border-radius:10px}
.map text{font:600 10.5px var(--f-body);fill:var(--fg);text-anchor:middle;pointer-events:none}
.dz{stroke:var(--line);stroke-width:1.5;stroke-linejoin:round}
.dz.l0{fill:var(--surface2)} .dz.l1{fill:color-mix(in srgb,var(--warn) 28%,var(--surface))} .dz.l2{fill:color-mix(in srgb,var(--bad) 34%,var(--surface))}
.map .river{fill:none;stroke:var(--river);stroke-opacity:.28;stroke-width:9;stroke-linecap:round}
.map .ring{fill:none;stroke:var(--muted);stroke-opacity:.6;stroke-width:1.5;stroke-dasharray:5 4}
.map .ground{fill:var(--bg)}
.map .pin{fill:var(--accent);stroke:var(--accentfg);stroke-width:1.5}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .hd{background:none;border:0;font:700 10px var(--f-body);color:var(--muted);padding:0}
.cal .em{background:none;border:0}
.cal .cl{opacity:.38}
.cal div{border:1px solid var(--line);border-radius:6px;text-align:center;font:600 11px var(--f-mono);padding:3px 0 2px;background:var(--surface2);min-width:0}
.cal div small{display:block;font:700 9px var(--f-body);color:var(--muted);height:11px}
.cal .now{background:var(--pri);color:var(--prifg);border-color:transparent}
.cal .now small{color:var(--prifg)}
.leg{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;font-size:13px;margin-top:8px}
.leg div{display:flex;justify-content:space-between;gap:6px;min-width:0}
.rv{display:grid;grid-template-columns:minmax(0,1fr) 38px;gap:2px 8px;align-items:center;font-size:13.5px;margin:6px 0}
.rv .prog{grid-column:1/-1;height:8px}
.rv .prog i{background:var(--muted)}
.rv.me .prog i{background:var(--accent)}
.chart{width:100%;height:auto;display:block}
.chart text{font:500 9px var(--f-mono);fill:var(--muted)}
.chart .ax{stroke:var(--line);stroke-width:1}
.chart .br{fill:var(--good)} .chart .bc{fill:var(--muted);fill-opacity:.55}
.rank{display:flex;gap:8px;padding:4px 0;font-size:13.5px;color:var(--muted)}
.rank.on{color:var(--fg);font-weight:700}
.rank .mono{width:78px;flex:none;text-align:right;font-size:12px}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-in{max-width:600px;margin:0 auto;display:grid;grid-template-columns:repeat(var(--n,4),1fr)}
.nav button.new::after{content:'';position:absolute;top:9px;left:calc(50% + 10px);width:9px;height:9px;border-radius:50%;background:var(--bad)}
.nav button{position:relative;border:0;background:none;height:var(--nav);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11.5px;font-weight:600;color:var(--muted)}
.nav button svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav button[aria-selected="true"]{color:var(--pri)}
.badge{position:absolute;top:7px;left:calc(50% + 8px);background:var(--bad);color:#fff;border-radius:999px;font:700 10px var(--f-mono);min-width:17px;height:17px;display:grid;place-items:center;padding:0 4px}
#modal{position:fixed;inset:0;z-index:50;background:rgba(5,10,20,.62);display:flex;align-items:flex-end;justify-content:center;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
#modal[hidden]{display:none}
.trk{display:flex;flex-direction:column}.trk-r{border-left:3px solid var(--line);padding:4px 10px;margin:0 0 6px}.trk-r.on{border-color:var(--pri);background:var(--surface2)}.trk-r small{display:block;color:var(--muted);font-weight:600}
#modal.full{background:var(--bg);padding:0;align-items:stretch}#modal.full .mbox{max-width:none;max-height:none;height:100%;border:0;border-radius:0;padding:max(16px,env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px));margin:0 auto;width:100%;max-width:640px}
.mbox{background:var(--surface);border:1px solid var(--line);border-radius:16px;width:100%;max-width:520px;max-height:88%;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.mbox h2{margin:0;font:400 20px/1.15 var(--f-display);text-wrap:balance}
.mbox p{margin:0}
.mbox .btn{width:100%;text-align:left}
.mbox .btn small{display:block;font-weight:500;color:inherit;opacity:.8;font-size:12px;margin-top:2px}
#toasts{position:fixed;left:16px;right:16px;bottom:calc(var(--nav) + 12px + env(safe-area-inset-bottom,0px));z-index:60;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
.toast{background:var(--fg);color:var(--bg);border-radius:10px;padding:8px 12px;font-size:13.5px;font-weight:600;max-width:520px;box-shadow:0 6px 18px rgba(0,0,0,.3)}
.toast.good{background:var(--good);color:#fff} .toast.bad{background:var(--bad);color:#fff}
@media (min-width:640px){#modal{align-items:center}}
@media (prefers-reduced-motion:no-preference){.prog i{transition:width .2s linear}.tk .mb{transition:width .2s linear}}
.av{width:44px;height:44px;border-radius:50%;flex:none;display:block}.av.sm{width:30px;height:30px}
.fld{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted);font-weight:600}
.inp{font:inherit;font-size:16px;color:var(--fg);background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:9px 12px;width:100%}
.avs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.avb{border:2px solid var(--line);background:var(--surface2);border-radius:12px;padding:5px 3px;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:11.5px;font-weight:700;min-width:0}
.avb small{font-size:10.5px;color:var(--muted);font-weight:600}
.avb.on{border-color:var(--pri);box-shadow:0 0 0 2px var(--pri)}
.avb svg{width:100%;height:auto}
.tkmore{align-self:center;font:600 13px var(--f-mono)}
.prods{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:6px}
.prd{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border:1px solid var(--line);background:var(--surface2);border-radius:14px;min-height:80px;height:auto;padding:7px 2px;font:800 10.5px/1.12 var(--f-body);overflow-wrap:normal;word-break:normal;hyphens:none;color:var(--fg)}
.prd .ico{width:40px;height:40px;flex:none}.prd .opl{width:40px;height:40px}.gh{grid-column:1/-1;margin-top:6px;font:800 11px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}.gh:first-child{margin-top:0}.prd span{text-align:center}.prd.sub{border-style:dashed;border-color:var(--pri)}.prd.back{color:var(--muted)}
@media(max-width:350px){.prd{font-size:9px;padding-inline:0}}
.prd:active{background:var(--accent);color:var(--accentfg)}
.fault{border-color:var(--warn);border-width:2px}
details.types{font-size:12px;color:var(--muted)}
details.types summary{cursor:pointer;padding:4px 0}
.tyrow{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px}

.qtys{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin-top:6px}

#start .sig{position:absolute;right:max(8px,env(safe-area-inset-right,0px));bottom:max(4px,env(safe-area-inset-bottom,0px));z-index:3;display:flex;align-items:baseline;gap:4px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.7);pointer-events:none}
#start .sig span{font:600 8px system-ui,sans-serif}
#start .sig b{font:400 12px 'GLoc',cursive;transform:rotate(-5deg)}
#start .sbtn{font:var(--hw) 15px var(--f-display);border:0;border-radius:999px;padding:8px;color:var(--st-pf);background:var(--st-p);box-shadow:0 2px 0 var(--st-sh);width:100%;min-height:0}
#start .sbtn.sec{background:var(--st-glass);color:var(--st-gt);box-shadow:0 2px 0 rgba(0,0,0,.25)}
#start .sbtn:disabled{opacity:.5}
#start .sbtn:active{transform:translateY(2px)}
#start .row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#start .pick{display:flex;gap:6px;justify-content:center;align-items:center;font-size:8.5px}
#start .pick button{font:800 8.5px var(--f-body);border:1px solid rgba(255,255,255,.55);background:rgba(0,0,0,.25);color:#fff;border-radius:999px;padding:1px 7px;min-height:0}
#start .pick button[aria-pressed="true"]{background:var(--st-p);color:var(--st-pf);border-color:var(--st-p)}
#start .smsg{text-align:center;font-size:8.5px;min-height:1.2em}

.scene{margin-inline:-16px;border-radius:0;overflow:hidden;border:3px solid var(--sign);background:var(--sign);line-height:0}
.scene>svg{width:100%;height:auto;display:block}
.sc-bob{animation:scbob 2.2s ease-in-out infinite;transform-box:fill-box}
.clk-g,.clk-g *:not(.blink){animation:none!important}
.sc-shk{animation:scshk .45s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.sc-walk{animation:scwalk 6s ease-in-out infinite}
@keyframes scwalk{0%,100%{transform:translate(0,0)}25%{transform:translate(var(--dx),var(--dy))}50%{transform:translate(0,0)}75%{transform:translate(calc(var(--dx) * -1),calc(var(--dy) * -1))}}
.sc-in{animation:scin 2.8s ease-out both}
.sc-tk{animation:sctk 3.2s linear both}@keyframes sctk{from{transform:translate(var(--ex),var(--ey));opacity:0}6%{opacity:1}to{transform:translate(0,0);opacity:1}}
@keyframes scin{from{transform:translate(var(--ex),var(--ey));opacity:0}15%{opacity:1}to{transform:translate(0,0);opacity:1}}
.sc-sw{animation:scsw 1.6s ease-in infinite}
.wk-f,.wk-b{animation-duration:inherit;animation-delay:inherit;animation-iteration-count:infinite;animation-timing-function:linear}
.wk-f{animation-name:wkf}.wk-b{animation-name:wkb;opacity:0}
@keyframes wkf{0%,44.9%{opacity:0}45%,99.9%{opacity:1}100%{opacity:0}}
@keyframes wkb{0%,44.9%{opacity:1}45%,99.9%{opacity:0}100%{opacity:1}}
.sc-walkv{animation-name:scwalkv}
@keyframes scwalkv{0%{transform:translate(0,0)}45%,50%{transform:translate(0,calc(var(--dy) * -1))}95%,100%{transform:translate(0,0)}}
.sc-out{animation-name:scout;animation-timing-function:linear;animation-fill-mode:both}
@keyframes scout{from{transform:translate(0,0)}to{transform:translate(var(--ox),0)}}
@keyframes scbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
@keyframes scshk{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
@keyframes scsw{0%{transform:translateY(0);opacity:1}100%{transform:translateY(12px);opacity:0}}
.blink{animation:clkBl 4.6s infinite;transform-box:fill-box;transform-origin:50% 50%}@keyframes clkBl{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}.clk-g{animation:clkBr 3.6s ease-in-out infinite}@keyframes clkBr{0%,100%{transform:translateY(0)}50%{transform:translateY(-.7px)}}.clk-arm.on.fast{animation-duration:.22s}.clk-g.sc-shk{animation:scshk .45s ease-in-out infinite}
.glance{animation:glc 5.2s ease-in-out infinite}@keyframes glc{0%,35%,100%{transform:translateX(0)}45%,60%{transform:translateX(-1.3px)}70%,85%{transform:translateX(1.3px)}}.lgB.tap{animation:tapf .55s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 0}@keyframes tapf{0%,100%{transform:rotate(0)}50%{transform:rotate(5deg)}}
@keyframes clkType{0%,100%{transform:translateY(0)}35%{transform:translateY(-1.4px)}70%{transform:translateY(.6px)}}.clk-arm.on{animation:clkType .42s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.wk-b{display:none}.sc-bob,.sc-shk,.sc-sw,.sc-walk,.sc-in,.sc-tk,.clk-arm.on,.blink,.clk-g,.glance,.lgB.tap,.gwave,.gfade,.gtap,.gtap2,.gslam,.gphone,.gscr,.gwatch,.gwag{animation:none}}

#arrive,#pc{position:fixed;inset:0;z-index:44;max-width:600px;margin:0 auto;display:flex;flex-direction:column;overflow:hidden}
#arrive[hidden],#pc[hidden]{display:none!important}
#arrive{z-index:46;background:var(--bg);padding:max(12px,env(safe-area-inset-top,0px)) 16px calc(14px + env(safe-area-inset-bottom,0px));gap:12px;justify-content:center}
.arr-t{text-align:center;font:800 12px var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.bub{position:relative;background:#fff;color:#1d2433;border-radius:20px;padding:14px 16px;font:800 17px/1.3 var(--f-body);box-shadow:0 4px 0 rgba(0,0,0,.12)}
.bub:after{content:"";position:absolute;left:50%;bottom:-12px;margin-left:-12px;border:12px solid transparent;border-bottom:0;border-top-color:#fff}
.bub small{display:block;margin-top:6px;font:700 12.5px var(--f-body);color:#5a6478}
.arr-s{border-radius:20px;overflow:hidden;border:3px solid var(--sign);line-height:0}
.arr-s svg{width:100%;height:auto;display:block}
.arr-b{font:var(--hw) 20px var(--f-display);border:0;border-radius:999px;padding:14px;background:var(--accent);color:var(--accentfg);box-shadow:0 4px 0 rgba(0,0,0,.25);width:100%}
.arr-b:active{transform:translateY(3px)}
#pc{background:#C9C9C9;padding:max(4px,env(safe-area-inset-top,0px)) 4px calc(4px + env(safe-area-inset-bottom,0px));font-family:Tahoma,Verdana,Arial,sans-serif;--surface:#F6F8C0;--surface2:#fff;--line:#777;--fg:#000;--muted:#222;color:#000}
.pds{flex:1;min-height:0;display:flex;flex-direction:column;border:2px solid #000;background:#fff;color:#000;font-size:12px}
.pds button{font-family:inherit}
.ph1{flex:none;display:flex;align-items:center;gap:8px;background:#EDEDED;border-bottom:1px solid #666;padding:3px 6px}
.pn{font:900 17px/1 Tahoma,Arial,sans-serif;letter-spacing:.04em}.pn small{font:600 10px Tahoma,Arial,sans-serif;margin-left:4px;color:#333}

const CAP=500,ATMCAP=20000;
const atmCanLoad=()=>!(S.phase==='open'&&S.uOpen&&S.t<CLOSE);
function atmXfer(v){
  if(!S.upg.atm||!atmCanLoad())return false;normCash();S.atm=S.atm||0;S.atmG=Math.min(S.atmG||0,S.atm);
  if(v>0){const m=Math.floor(Math.min(v,S.vault||0,ATMCAP-S.atm)/10)*10;if(m<=0)return false;S.vault=Math.round((S.vault-m)*100)/100;S.cash-=m;S.atm+=m;return true;}
  const m=Math.min(-v,S.atm-S.atmG);if(m<=0)return false;S.atm-=m;S.vault=Math.round(((S.vault||0)+m)*100)/100;S.cash+=m;return true;}
function atmUse(){
  if(!S.upg.atm)return;
  if(S.fault&&S.fault.open===false&&(S.fault.id==='luce'||S.fault.id==='rete'))return;
  const want=pick([20,50,50,100,100,100,150,200,250,300,400,500,600]);
  S.atm=S.atm||0;S.atmG=Math.min(S.atmG||0,S.atm);const ok=S.atm>=20,d=ok?Math.min(want,Math.floor(S.atm/10)*10):0;
  if(ok){const own=Math.min(d,S.atm-S.atmG);S.atmG-=d-own;S.atm-=d;S.st.atmN=(S.st.atmN||0)+1;S.st.atmOut=(S.st.atmOut||0)+d;S.st.atmOwn=(S.st.atmOwn||0)+own;addCash(2,'rev');S.life+=2;}
  else{S.st.atmF=(S.st.atmF||0)+1;adjRep(-.12);if(!RT.atmLog||S.t-RT.atmLog>25){RT.atmLog=S.t;log('L’ATM è senza contanti: i clienti si lamentano.','bad');toast('ATM senza contanti','bad');}}
}

const drw=()=>Math.round((S.cash-(S.safe||0)-(S.vault||0))*100)/100;
function normCash(){S.safe=S.safe||0;S.vault=S.vault||0;if(S.cash<0){S.safe=0;S.vault=0;}if(S.vault>S.cash)S.vault=Math.max(0,Math.round(S.cash*100)/100);if(S.safe>S.cash-S.vault)S.safe=Math.max(0,Math.round((S.cash-S.vault)*100)/100);}
function vaultXfer(v){normCash();if(v>0){const m=Math.min(v,S.safe);if(m<=0)return false;S.safe=Math.round((S.safe-m)*100)/100;S.vault=Math.round((S.vault+m)*100)/100;return true;}const m=Math.min(-v,S.vault);if(m<=0)return false;S.vault=Math.round((S.vault-m)*100)/100;S.safe=Math.round((S.safe+m)*100)/100;return true;}
function safeXfer(v){normCash();
  if(v>0){const m=Math.min(v,Math.max(0,drw()));if(m<=0)return false;S.safe=Math.round((S.safe+m)*100)/100;return true;}
  const m=Math.min(-v,S.safe,Math.max(0,CAP-drw()));if(m<=0)return false;S.safe=Math.round((S.safe-m)*100)/100;return true;}
function safePage(k){
  normCash();const d=drw(),sf=S.safe||0,room=Math.max(0,CAP-d);
  const bt=(v,l,ok)=>`<button class="pr" type="button" ${ok?`data-act="safe" data-sv="${v}"`:'disabled'}><span>${l}</span></button>`;
  const A=[50,100,250];
  return `<div class="plist"><p class="safei">Sportello: <b class="${d>CAP+.01?'neg':''}">${eur(d,2)}</b> (max ${eur(CAP)}${d>CAP+.01?': versa l’eccedenza!':''})<br>Safety cash: <b>${eur(sf,2)}</b></p>
   ${A.map(v=>bt(v,'Versa '+eur(v),d>=v)).join('')}${bt(Math.ceil(d-CAP),'Versa l’eccedenza oltre '+eur(CAP),d>CAP+.01)}${bt(Math.floor(d),'Versa tutto il cassetto',d>=1)}
   ${A.map(v=>bt(-v,'Preleva '+eur(v),sf>=v&&room>=v)).join('')}${bt(-Math.floor(Math.min(sf,room)),'Preleva fino a '+eur(CAP),Math.min(sf,room)>=1)}<button class="pr bk" type="button" data-act="sub" data-k="${k.id}" data-sub=""><span>‹ Indietro</span></button></div>`;
}
function guardie(amt,adv){
  S.dc=S.dc||{};amt=Math.round(amt);S.cash+=amt;S.vault=Math.round(((S.vault||0)+amt)*100)/100;
  if(adv){S.dcAdv=(S.dcAdv||0)+amt;S.dcDone=true;}
  S.dc.msg={d:S.day+1,amt,adv:!!adv};
  log(`Due guardie giurate hanno portato ${eur(amt)} nella cassaforte${adv?' (anticipo della Direzione Generale per le pensioni)':''}.`,'info');
}
function dcHTML(){
  const m=S.dc&&S.dc.msg;if(!m)return'';
  return `<div class="card fault"><div class="eyebrow">Direzione Centrale · avviso</div><p style="margin:4px 0">Le guardie giurate hanno consegnato <b>${eur(m.amt)}</b> in ufficio${m.atm?' come sovvenzione per l’ATM, già caricata':m.adv?' per pagare le pensioni':''}.</p><p class="muted" style="margin:0;font-size:13px">${m.atm?`ATM: <b>${eur(S.atm||0,0)}</b>.`:`Cassaforte: <b>${eur(S.vault||0,2)}</b>.`}${m.adv?' L’anticipo viene recuperato a fine giorni pensioni.':''}</p></div>`;
}

function pdsNav(k){
  const cur=k.menu||'',tabs=[{p:'',l:'Home'}];
  if(cur==='$safe')tabs.push({p:'$safe',l:'Safety cash'});
  else if(cur){let nodes=MT,acc='';for(const pt of cur.split('/')){const n=nodes.find(x=>x.id===pt);if(!n)break;acc=acc?acc+'/'+pt:pt;tabs.push({p:acc,l:n.l});nodes=n.kids||[];}}
  return tabs.map((t,i)=>`<button type="button" class="ptab${i===tabs.length-1?' on':''}" data-act="sub" data-k="${k.id}" data-sub="${t.p}">${esc(t.l)}</button>`).join('');
}
function prodStrip(k,dis){
  if(k.menu==='$safe')return safePage(k);
  const c=k.cur,cn=id=>c&&c.cnt&&c.cnt.n&&((c.cnt.it.op==='pp'?'pp_':'')+c.cnt.it.prod)===id?c.cnt.n:0;
  let cur=k.menu||'',nodes=MT;
  if(cur){let ok=true;for(const pt of cur.split('/')){const n=nodes.find(x=>x.id===pt);if(!n||!n.kids){ok=false;break;}nodes=n.kids;}if(!ok){cur='';nodes=MT;}}
  const rows=nodes.filter(t=>!t.vis||t.vis()).map(t=>{
    const smv=t.id==='chi'?(clPend().length?`${clPend().length} da fare · ${hh(CLOSE+1)}–${hh(CLEND)}`:'tutte fatte'):t.cl?(S.cls&&S.cls[t.cl]?`fatta · ${(S.clN&&S.clN[t.cl])||0} spedizioni`:clOK()?'da fare':S.t<=CLOSE?`dopo le ${hh(CLOSE+1)}`:''):t.sm;
    const code='',lab=`<span>${esc(t.l)}${smv?`<small>${esc(smv)}</small>`:''}</span>`;
    if(t.kids){const p=cur?cur+'/'+t.id:t.id;
      return `<button class="pr" type="button" data-act="sub" data-k="${k.id}" data-sub="${p}">${code}${lab}<i class="car">›</i></button>`;}
    if(t.cl){const ok=clOK()&&!(S.cls&&S.cls[t.cl]);return `<button class="pr${ok?'':' nx'}" type="button" ${ok?`data-act="chiu" data-k="${k.id}" data-cl="${t.cl}"`:'disabled'}>${code}${lab}</button>`;}
    const n=cn(t.id);
    return `<button class="pr${t.off?' nx':''}" type="button" ${dis||t.off?'disabled':`data-act="prod" data-k="${k.id}" data-prod="${t.id}"`}>${code}${lab}${n?`<i class="cntb">${n}</i>`:''}${t.key?`<em class="fk">${t.key}</em>`:''}</button>`;}).join('');
  const back=cur?`<button class="pr bk" type="button" data-act="sub" data-k="${k.id}" data-sub="${cur.split('/').slice(0,-1).join('/')}"><span>‹ Indietro</span></button>`:'';
  return `<div class="plist">${rows}${back}</div>`;
}

function opSnd(manual,dur,beep){
  if(!RT.snd||!AC)return;
  const now=Date.now();if(!manual&&now-OPLAST<400)return;if(!manual)OPLAST=now;

  try{const t0=AC.currentTime+.02,vol=manual?1.45:.8,ns=AC.createBuffer(1,AC.sampleRate,AC.sampleRate),nd=ns.getChannelData(0);let l=0;for(let i=0;i<nd.length;i++){l=(l+.04*(Math.random()*2-1))/1.04;nd[i]=l*9;}
    const M=AC.createGain();M.gain.value=.7*vol;M.connect(AC.destination);
    const ts=t0+lead,te=t0+dur,gap=.075;let t=ts;
    while(true){t+=gap*(.5+Math.random())+(Math.random()<.12?gap*2:0);if(t>te)break;
      const s=AC.createBufferSource();s.buffer=ns;const f=AC.createBiquadFilter();f.type='highpass';f.frequency.value=1800+Math.random()*1400;
